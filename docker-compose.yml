version: '3.8'

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: honda_recommender
      POSTGRES_USER: recommender_user
      POSTGRES_PASSWORD: strong_password_here
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8080:80"
    depends_on:
      - db

  web:
    build: .
    environment:
      DATABASE_URL: postgresql://recommender_user:strong_password_here@db:5432/honda_recommender
    ports:
      - "5000:5000"
    depends_on:
      - db

volumes:
  postgres_data: